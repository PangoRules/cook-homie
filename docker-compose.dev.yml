services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cookhomie}
      POSTGRES_USER: ${POSTGRES_USER:-cookhomie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cookhomie_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-cookhomie} -U ${POSTGRES_USER:-cookhomie}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CONNECTIONSTRINGS_DEFAULTCONNECTION: Host=postgres;Database=${POSTGRES_DB:-cookhomie};Username=${POSTGRES_USER:-cookhomie};Password=${POSTGRES_PASSWORD:-cookhomie_dev_password}
    volumes:
      - ./src/CookHomie.Api:/app
    command: ["sh", "-c", "echo 'API dev placeholder (hot reload pending scaffold)'; sleep infinity"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    environment:
      NODE_ENV: development
    volumes:
      - ./src/CookHomie.Web:/app
    command: ["sh", "-c", "echo 'Web dev placeholder (hot reload pending scaffold)'; sleep infinity"]

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    environment:
      - MCP_ENV=development
      - API_BASE_URL=http://api:5000
    volumes:
      - ./src/CookHomie.MCP:/app
    ports:
      - "${MCP_PORT:-8000}:8000"
    depends_on:
      - api
