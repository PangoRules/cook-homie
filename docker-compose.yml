name: cook-homie

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cookhomie}
      POSTGRES_USER: ${POSTGRES_USER:-cookhomie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cookhomie_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cookhomie};Username=${POSTGRES_USER:-cookhomie};Password=${POSTGRES_PASSWORD:-cookhomie_dev_password}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    volumes:
      - ./src/CookHomie.Web:/app
      - /app/.nuxt
      - /app/node_modules
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NUXT_API_BASE_URL: http://api:5000
      NUXT_PUBLIC_APP_ENV: ${NUXT_PUBLIC_APP_ENV:-production}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    environment:
      COOKHOMIE_API_BASE_URL: http://api:5000
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    depends_on:
      - api

volumes:
  postgres_data:
