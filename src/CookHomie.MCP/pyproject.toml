[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cookhomie-mcp"
version = "0.1.0"
description = "CookHomie MCP server"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools]
py-modules = ["api_client", "server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
exclude = ["tests*"]
