version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cookhomie}
      POSTGRES_USER: ${POSTGRES_USER:-cookhomie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cookhomie_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-cookhomie} -U ${POSTGRES_USER:-cookhomie}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      CONNECTIONSTRINGS_DEFAULTCONNECTION: Host=postgres;Database=${POSTGRES_DB:-cookhomie};Username=${POSTGRES_USER:-cookhomie};Password=${POSTGRES_PASSWORD:-cookhomie_dev_password}
    volumes:
      - ./src/CookHomie.Api:/src
    working_dir: /src/CookHomie.WebApi
    command: ["dotnet", "run", "--project", "CookHomie.WebApi.csproj"]
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NODE_ENV: development
    volumes:
      - ./src/CookHomie.Web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    environment:
      - MCP_ENV=development
      - API_BASE_URL=http://api:5000
    volumes:
      - ./src/CookHomie.MCP:/app
    ports:
      - "${MCP_PORT:-8000}:8000"
    depends_on:
      - api

volumes:
  postgres_data: